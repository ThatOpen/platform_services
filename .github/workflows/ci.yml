name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Shared backend contract types arrive as a submodule pointing at a
      # private repo, so the default GITHUB_TOKEN cannot clone it. The
      # credential is scoped to this step rather than passed to checkout, so
      # it never becomes the identity for anything else in the job.
      #
      # types:init also re-applies the sparse checkout, which lives in the
      # submodule's .git and does not survive a fresh clone.
      - name: Fetch backend contract types
        env:
          BACKEND_TYPES_TOKEN: ${{ secrets.BACKEND_TYPES_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${BACKEND_TYPES_TOKEN}@github.com/".insteadOf "https://github.com/"
          yarn types:init
          git config --global --unset-all url."https://x-access-token:${BACKEND_TYPES_TOKEN}@github.com/".insteadOf

      - run: yarn install --frozen-lockfile

      - run: yarn build
