name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The backend repo is private, so the default GITHUB_TOKEN cannot clone
      # the submodule. Either secret works; the script picks whichever is set
      # and prints setup instructions if neither is. It also re-applies the
      # sparse checkout, which does not survive a fresh clone.
      - name: Fetch backend contract types
        env:
          BACKEND_TYPES_DEPLOY_KEY: ${{ secrets.BACKEND_TYPES_DEPLOY_KEY }}
          BACKEND_TYPES_TOKEN: ${{ secrets.BACKEND_TYPES_TOKEN }}
        run: yarn types:init

      - run: yarn install --frozen-lockfile

      - run: yarn build
